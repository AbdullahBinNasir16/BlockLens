# One origin for the app and the BlockLens API. Since Phase 7 the browser
# never calls a third party: the API proxies GeckoTerminal, DexScreener and
# GoPlus itself, behind its rate budget and a shared cache.
resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fingerprinted assets never change; the shell must not be cached.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }

    location /api/stream {
        # server-sent events: no buffering, and a long read timeout
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
