# Mirrors vite.config.ts: one origin for the app, the BlockLens API and the
# three keyless public sources. The API host is overridable so the same
# image serves a compose stack (api:8000) or a hosted backend.
resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fingerprinted assets never change; the shell must not be cached.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /gt/ {
        proxy_pass https://api.geckoterminal.com/api/v2/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.geckoterminal.com;
        proxy_set_header Accept "application/json";
    }
    location /ds/ {
        proxy_pass https://api.dexscreener.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.dexscreener.com;
    }
    location /gp/ {
        proxy_pass https://api.gopluslabs.io/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.gopluslabs.io;
    }
}
