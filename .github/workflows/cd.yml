# Continuous delivery: a merge into main publishes runnable images of both
# halves to the GitHub Container Registry, tagged with the commit and the
# branch, and a version tag cuts a GitHub Release carrying the built web
# bundle. If a Render deploy hook is configured as a secret, the hosted
# instance is redeployed from the same commit.
name: CD

on:
  push:
    branches: [main, develop]     # develop publishes the `develop` (staging) tag
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Publish ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: web
            context: .
            dockerfile: Dockerfile
          - image: api
            context: backend
            dockerfile: backend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case the image name (GHCR requires it)
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package the web bundle
        run: (cd dist && zip -qr ../blocklens-web-${GITHUB_REF_NAME}.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: blocklens-web-*.zip

  scan:
    name: Scan ${{ matrix.image }} image
    needs: images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [web, api]
    steps:
      - name: Lower-case the image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.image }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Trivy's own image, rather than the marketplace action, whose tags
      # could not be resolved from this repository (CD run of 2026-10-22).
      - name: Trivy, critical and high
        run: |
          docker run --rm \
            -e TRIVY_USERNAME="${{ github.actor }}" -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}" \
            aquasec/trivy:latest image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 \
            --format table "${{ steps.name.outputs.image }}"

  deploy:
    name: Redeploy hosted instance
    needs: [images, scan]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger the deploy hook
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" >/dev/null && echo "deploy triggered"
      - name: No hosting configured
        if: env.HOOK == ''
        run: echo "RENDER_DEPLOY_HOOK is not set; images are published to GHCR and can be run with docker-compose.prod.yml"
