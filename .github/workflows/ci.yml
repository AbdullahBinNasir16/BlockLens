# Continuous integration: every push to an integration branch and every pull
# request into one must type-check, pass its tests and build, for both halves
# of the repository. A red check blocks the merge.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (clean, from the lockfile)
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Keep the built bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
          retention-days: 7

  backend:
    name: Backend · pytest against PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The store tests prove idempotency with PostgreSQL-specific SQL, so they
    # skip without a real database. In CI they run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blocklens
          POSTGRES_PASSWORD: blocklens
          POSTGRES_DB: blocklens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blocklens -d blocklens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://blocklens:blocklens@localhost:5432/blocklens_test
      BLOCKLENS_LIVE: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests (no network; the transport is blocked for the whole suite)
        run: python -m pytest -q -rs
