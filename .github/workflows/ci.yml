# Continuous integration: every push to an integration branch and every pull
# request into one must type-check, pass its tests and build, for both halves
# of the repository. A red check blocks the merge.
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:          # every pull request, including one into a feature branch (stacked work)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (clean, from the lockfile)
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: The API contract has not drifted from src/data/api.ts
        run: node scripts/contract.mjs --check

      - name: Unit tests, with a coverage floor
        run: npm run test:coverage

      - name: Keep the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-${{ github.sha }}
          path: coverage/lcov.info
          retention-days: 7

      - name: Production build
        run: npm run build

      - name: Keep the built bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
          retention-days: 7

  backend:
    name: Backend · pytest against PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The store tests prove idempotency with PostgreSQL-specific SQL, so they
    # skip without a real database. In CI they run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blocklens
          POSTGRES_PASSWORD: blocklens
          POSTGRES_DB: blocklens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blocklens -d blocklens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://blocklens:blocklens@localhost:5432/blocklens_test
      BLOCKLENS_LIVE: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests (no network; the transport is blocked for the whole suite)
        run: python -m pytest -q -rs --cov=blocklens --cov-report=xml --cov-report=term

      - name: Keep the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-${{ github.sha }}
          path: backend/coverage.xml
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (high and above fails)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit on the backend's pins
        run: |
          python -m pip install pip-audit
          cd backend && python -m pip install -e . && pip-audit --progress-spinner off

  e2e:
    name: End to end · browser against the real API
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blocklens
          POSTGRES_PASSWORD: blocklens
          POSTGRES_DB: blocklens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blocklens -d blocklens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://blocklens:blocklens@localhost:5432/blocklens
      BLOCKLENS_LIVE: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install and migrate the API
        working-directory: backend
        run: |
          python -m pip install -e .
          python -m alembic upgrade head
      - name: Start the API (no live loop)
        working-directory: backend
        run: |
          nohup python -m uvicorn blocklens.api.app:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npm run e2e -- --project=chromium || npm run e2e
      - name: Keep the trace and the API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.sha }}
          path: |
            playwright-report
            test-results
            api.log
          retention-days: 7

  compose:
    # The clean-machine path of RUNNING.md, for real: a fresh runner, the
    # repository, and one command. If a step is missing from RUNNING.md,
    # this job is where it shows.
    name: Clean machine · docker compose up
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      BLOCKLENS_LIVE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up --build (RUNNING.md, step 2)
        run: docker compose up --build -d
      - name: The API is healthy and the model is loaded
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/api/health > health.json && break; sleep 3; done
          cat health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['database']['ok'] and h['model']['loaded'], h"
      - name: The built front end is served, with client-side routes
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/app/trending | grep -q '<div id="root">'
      - name: The bundle calls no third party itself
        run: |
          docker compose cp web:/usr/share/nginx/html ./served
          ! grep -rqE "api\.geckoterminal|api\.dexscreener|api\.gopluslabs|/gt/|/ds/|/gp/" served/assets
      - name: Every route answers in the contract through nginx
        run: |
          curl -fsS http://127.0.0.1:8080/api/token-risk/0x1111111111111111111111111111111111111111 | grep -q '"out_of_scope"'
          echo "trending through nginx: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/trending)"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - name: Down
        if: always()
        run: docker compose down -v
